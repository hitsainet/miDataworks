# nginx config for hitsai/midataworks-frontend (ADR-024; Foundation task 15.1).
# nginx-unprivileged listens on 8080 as uid 101. Static files only: the ingress routes /api/
# (REST and the Socket.IO path /api/ws/socket.io) to the backend, so nothing here proxies.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Hashed build assets never change under one name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Liveness for the pod; never cached.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # The worker emit route is never served from here (it is not under /api/ and the ingress
    # does not route it either); answer 404 rather than the app shell.
    location /internal/ {
        return 404;
    }

    # The app shell for every client-side route; index.html itself is never cached, so a new
    # deploy is picked up on the next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
